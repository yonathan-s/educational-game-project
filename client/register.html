<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Escape — Sign Up</title>
    <link rel="stylesheet" href="./css/auth.css" />
  </head>
  <body>
    <div class="page">
      <h1 class="title">Historical Escape</h1>
      <p class="subtitle">Every escape begins with a name in the record</p>

      <div class="card">
        <h2>Sign Up</h2>

        <form action="#" method="post">
          <div class="input">
            <label for="signup-name">Your Name</label>
            <input
              type="text"
              id="signup-name"
              name="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="input">
            <label for="signup-password">Password</label>
            <input
              type="password"
              id="signup-password"
              name="password"
              placeholder="Choose a password"
              required
            />
          </div>

          <button type="submit" class="button">Create Account</button>
        </form>

        <hr class="divider" />

        <p class="switch">Go back to <a href="./login.html">Login</a></p>
      </div>
    </div>
  </body>
</html>
