<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Escape — Question 1</title>
    <link rel="stylesheet" href="../css/quiz.css" />
  </head>
  <body>
    <div class="page">
      <div class="quiz-card">
        <div class="quiz-header">
          <div class="quiz-icon">&#127984;</div>
          <h1 class="quiz-location">The Palace, Hampton Court</h1>
        </div>

        <div class="quiz-meta">
          <span id="progress-label">Question 1/3</span>
          <div class="progress-track">
            <div
              class="progress-fill"
              id="progress-fill"
              style="width: 0%"
            ></div>
          </div>
          <span class="quiz-points" id="points-display">100 pts</span>
        </div>

        <div class="quiz-body">
          <div class="question-tag" id="question-tag">
            The Palace &middot; Question I
          </div>

          <div class="question-box" id="question-text">
            Who was the reigning monarch of England in 1536?
          </div>

          <div class="options-grid" id="options-grid">
            <a
              class="option-btn"
              question-id="1"
              answer-id="1"
              href="correct.html"
              >Henry VIII</a
            >
            <button class="option-btn" question-id="1" answer-id="2">
              Henry VII
            </button>
            <button class="option-btn" question-id="1" answer-id="3">
              Edward VI
            </button>
            <button class="option-btn" question-id="1" answer-id="4">
              Mary I
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
