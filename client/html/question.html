<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Escape — Question 1</title>
    <link rel="stylesheet" href="../css/quiz.css" />
  </head>

  <body>
    <div class="page">
      <div class="quiz-card" id="state-quiz">
        <div class="quiz-header">
          <div class="quiz-icon"></div>
          <h1 class="quiz-location">The Palace, Hampton Court</h1>
        </div>

        <div class="quiz-meta">
          <span id="quiz-progress-label">Question 0/0</span>
          <div class="progress-track">
            <div
              class="progress-fill"
              id="quiz-progress-fill"
              style="width: 0%"
            ></div>
          </div>
          <span class="quiz-points">
            <span id="timer-display">30</span>s |
            <span id="quiz-points-display">0 pts</span></span
          >
        </div>

        <div class="quiz-body">
          <div class="question-tag" id="question-tag">
            The Palace &middot; Question I
          </div>

          <div class="question-box" id="question-text">
            Loading historical data file...
          </div>

          <div class="options-grid" id="options-grid"></div>
        </div>
      </div>

      <div class="quiz-card" id="state-feedback" style="display: none">
        <div class="quiz-header">
          <div class="quiz-icon"></div>
          <h1 class="quiz-location">The Palace, Hampton Court</h1>
        </div>

        <div class="quiz-meta">
          <span id="feedback-progress-label">Question 0/0</span>
          <div class="progress-track">
            <div
              class="progress-fill"
              id="feedback-progress-fill"
              style="width: 0%"
            ></div>
          </div>
          <span class="quiz-points" id="feedback-points-display">0 pts</span>
        </div>

        <div class="quiz-body">
          <div class="result-box">
            <div class="result-badge" id="feedback-badge">
              <span id="feedback-badge-status">WELL<br />DONE</span>
              <span class="result-points" id="feedback-badge-points"
                >+100pts</span
              >
            </div>

            <div class="result-message">
              <p id="feedback-message-text">
                Good job answering the question, you are one step closer to
                escape.
              </p>
              <button
                class="option-btn"
                id="continue-btn"
                style="border: none; cursor: pointer; width: 100%"
              >
                Click here to move on
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/questionsApi.js"></script>
    <script src="../js/quiz.js"></script>
  </body>
</html>
