<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Escape — Level Select</title>
    <link rel="stylesheet" href="../css/level.css" />
  </head>
  <body>
    <div class="page">
      <div class="level-card">
        <div class="level-header">
          <h1>Welcome to the<br />History Escape Game</h1>
        </div>

        <details class="level-row">
          <summary>
            <p class="level-name">Level 1 · The Tudors</p>
            <p class="hint">Click to see the 4 stages — only Stage 1 is open</p>
          </summary>
          <div class="stage-list">
            <a href="stage.html" class="stage-item">Stage 1</a>
            <p class="stage-item locked">Stage 2</p>
            <p class="stage-item locked">Stage 3</p>
            <p class="stage-item locked">Stage 4</p>
          </div>
        </details>

        <div class="level-row locked">
          <p class="level-name">Level 2 · The Romans</p>
          <p class="lock-label">Locked</p>
        </div>

        <div class="level-row locked">
          <p class="level-name">Level 3 · The Spanish Armada</p>
          <p class="lock-label">Locked</p>
        </div>
      </div>
    </div>
  </body>
</html>
