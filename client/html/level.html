<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Escape — Level Select</title>
    <link rel="stylesheet" href="../css/level.css" />
    <script src="../js/level.js" defer></script>
  </head>
  <body>
    <div class="page">
      <div class="level-card">
        <div class="level-header">
          <h1>Welcome to the<br />History Escape Game</h1>
        </div>

        <details class="level-row">
          <summary>
            <p class="level-name">Level 1 · The Tudors</p>
            <p class="hint" id="level-hint">Loading your progress tracking...</p>
          </summary>
          <div class="stage-list" id="stages-container">
            <a  class="stage-item">Learning 1</a>
          </div> 

        </details>

        <div class="level-row locked">
          <p class="level-name">Level 2 · The Romans</p>
          <p class="lock-label">Locked</p>
        </div>

        <div class="level-row locked">
          <p class="level-name">Level 3 · The Spanish Armada</p>
          <p class="lock-label">Locked</p>
        </div>
      </div>
    </div>
  </body>
</html>
