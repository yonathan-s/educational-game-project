<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historical Escape — Login</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="page">
      <h1 class="title">Historical Escape</h1>
      <p class="subtitle">Return to the past you left unfinished</p>

      <div class="card">
        <h2>Login</h2>

        <div id="success-message" class="success-message">Account created successfully</div>

        <form id="login-form">
          <div class="input">
            <label for="login-name">Username</label>
            <input
              type="text"
              id="login-name"
              name="username"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="input">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <button type="submit" class="button">Enter the past</button>
        </form>

        <hr class="divider" />

        <p class="footer">The ancestors keep no clock</p>
        <p class="switch" style="margin-top: 14px">
          New to the escape? <a href="./register.html">Create an account</a>
        </p>
      </div>
    </div>
    <script src="../js/login.js"></script>
  </body>
</html>
